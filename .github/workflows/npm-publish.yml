name: npm publish (manual)

# Manual "publish current version to npm" button. Automatic publishing happens
# in the Release pipeline (release.yml → publish job); this is a fallback you can
# run from the Actions tab — e.g. to publish a version whose auto-publish failed
# (such as the first run before NPM was set).
# Requires an NPM repository secret (npm "Automation" classic token).

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
